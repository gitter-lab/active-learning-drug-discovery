name: Test active learning in drug discovery

on:
- push
- pull_request
jobs:
  Test:
    name: Test active learning in drug discovery
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Old packages not expected to work on macos-latest with arm64
        # macOS with x86_64 available through August 2027 https://github.com/actions/runner-images/issues/13045
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install conda environment
        uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: active_learning_dd
          environment-file: conda_cpu_env.yml
          auto-activate: false
          miniconda-version: 'latest'
      # Resolve the env's Python interpreter path per-OS. We call it directly
      # instead of `conda activate` to avoid the keras activation hook
      # (keras_activate.sh probes theano and fails), bash 3.2 activation quirks
      # on macOS, and the "conda: command not found" Git Bash issue on Windows.
      - name: Resolve environment python
        id: py
        shell: bash {0}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "python=$CONDA/envs/active_learning_dd/python.exe" >> "$GITHUB_OUTPUT"
          else
            echo "python=$CONDA/envs/active_learning_dd/bin/python" >> "$GITHUB_OUTPUT"
          fi
      - name: Install active_learning_dd package
        shell: bash {0}
        run: "${{ steps.py.outputs.python }}" -m pip install -v -e .
      - name: Test sample data runner
        shell: bash {0}
        run: |
          set -e
          cd chtc_runners
          "${{ steps.py.outputs.python }}" sample_data_runner.py \
            --pipeline_params_json_file=../param_configs/sample_data_config.json \
            --hyperparams_json_file=../param_configs/experiment_PstP_hyperparams/sampled_hyparams/ClusterBasedWCSelector_609.json \
            --iter_max=5 \
            --precompute_dissimilarity_matrix \
            --initial_dataset_file=../datasets/sample_data/training_data/iter_0.csv.gz
