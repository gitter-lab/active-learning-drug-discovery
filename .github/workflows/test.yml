name: Test active learning in drug discovery

on:
- push
- pull_request
jobs:
  Test:
    name: Test active learning in drug discovery
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Old packages not expected to work on macos-latest with arm64
        # macOS with x86_64 available through August 2027 https://github.com/actions/runner-images/issues/13045
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install conda environment
        uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: active_learning_dd
          environment-file: conda_cpu_env.yml
          auto-activate: false
          miniconda-version: 'latest'
      - name: Trace activation
        shell: bash -x {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate active_learning_dd
          which python
          python --version
      - name: Debug shell (non-login sanity check)
        shell: bash {0}
        run: echo "non-login shell works"
      - name: Debug shell activation
        shell: bash {0}
        run: |
          echo "made it past profile sourcing"
          which python
          conda info
      - name: Install active_learning_dd package
        shell: bash {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate active_learning_dd
          which python
          python -m pip install -v -e .
      - name: Debug env
        shell: bash {0}
        run: |
          which python
          which pip
          python -c "import sys; print(sys.executable)"
          conda list
      - name: Test sample data runner
        shell: bash {0}
        run: |
          set -e
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate active_learning_dd
          cd chtc_runners
          python sample_data_runner.py \
            --pipeline_params_json_file=../param_configs/sample_data_config.json \
            --hyperparams_json_file=../param_configs/experiment_PstP_hyperparams/sampled_hyparams/ClusterBasedWCSelector_609.json \
            --iter_max=5 \
            --precompute_dissimilarity_matrix \
            --initial_dataset_file=../datasets/sample_data/training_data/iter_0.csv.gz